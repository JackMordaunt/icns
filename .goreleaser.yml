# Make sure to check the documentation at http://goreleaser.com
version: 2
before:
  hooks:
    - go mod tidy
    - go generate ./...
builds:
  - main: ./cmd/icnsify
    id: "icnsify"
    binary: icnsify
    goos:
      - linux
      - windows
      - darwin
archives:
  - format_overrides:
    - goos: windows
      formats: [zip]
brews:
  -
   name: icnsify
   repository:
      owner: "jackmordaunt"
      name: homebrew-tap
scoops:
  -
    repository:
      owner: "jackmordaunt"
      name: scoop-bucket
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
