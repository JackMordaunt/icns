name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so new advisories surface without waiting for a commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  library:
    name: library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # go-version-file reads the go directive, so CI proves the declared
      # minimum actually builds rather than whatever is newest.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/preview/go.sum
            cmd/shell-extension/go.sum
      - run: go build ./...
      - name: go test
        # Windows runners default to PowerShell, and this is a shell script.
        shell: bash
        run: |
          status=0
          go test -count=1 ./... 2>&1 | tee go-test.log || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '\.go:[0-9]+|FAIL' go-test.log | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done || true
          fi
          exit "$status"

  race:
    name: library under the race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The encoder resizes every icon concurrently.
      - run: go test -count=1 -race ./...

  fuzz:
    name: decoder fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -run='^$' -fuzz=FuzzDecode -fuzztime=120s .
      - name: Keep any crasher for download
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus
          path: testdata/fuzz

  oracle:
    name: iconutil oracle
    # Apple's own tool is the only authority on the format, and it ships with
    # the macOS runner. The tests are darwin-only, so this is where they run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Annotations show on the run itself, so a failure here is legible
      # without opening the log.
      - name: iconutil oracle
        run: |
          status=0
          go test -count=1 -v -run 'TestIconutil' . 2>&1 | tee oracle.log || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E 'oracle_test\.go|FAIL|iconutil' oracle.log | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done || true
          fi
          exit "$status"

  shell-extension:
    name: shell extension
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cmd/shell-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cmd/shell-extension/go.mod
          cache-dependency-path: cmd/shell-extension/go.sum
      # The DLL is built with -buildmode=c-shared, which needs cgo.
      - run: gcc --version
      - run: go vet ./...
      - run: go test -count=1 ./...
      # Outside the workspace the module resolves the published library, which
      # is what `go install` gets; it catches a go.sum that never learned it.
      - run: go build ./...
        env:
          GOWORK: "off"

  preview:
    name: preview (${{ matrix.os }})
    # Gio needs a long list of X11 and Wayland headers on Linux, so the GUI is
    # only built where its dependencies ship with the runner.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cmd/preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cmd/preview/go.mod
          cache-dependency-path: cmd/preview/go.sum
      - run: go build ./...
      - run: go vet ./...
      # The render test skips itself where the runner has no GPU to draw on.
      - run: go test -count=1 ./...
      - run: go build ./...
        env:
          GOWORK: "off"

  checks:
    name: formatting, vet and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            cmd/preview/go.sum
            cmd/shell-extension/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      # Only the library, which builds anywhere. The command modules are
      # vetted in their own jobs: preview needs a desktop toolchain that Linux
      # runners lack, and the shell extension has no files outside Windows.
      - run: go vet ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
