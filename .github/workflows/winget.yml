name: Publish to Winget
on:
  release:
    types: [released]

# The action authenticates with a token of its own, so nothing here needs
# the one GitHub injects.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: JackMordaunt.icnsify
          installers-regex: '_windows_\w+\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
